name: Verify

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify_${{ github.workflow }}_${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Dart analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
        working-directory: example
      - run: flutter test
        working-directory: example

  ios:
    name: iOS example build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select --switch /Applications/Xcode_26.5.app
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build ios --simulator --debug
        working-directory: example
      - run: flutter build ios --simulator --debug --target lib/voice_control_main.dart
        working-directory: example
      - name: Build conversational app entitlement configuration
        run: >-
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          FLUTTER_TARGET=lib/voice_control_main.dart
          CARPLAY_ENTITLEMENTS_FILE=Conversational.entitlements build
        working-directory: example
      - name: Run native CarPlay regressions
        run: |
          gem install xcodeproj --user-install --no-document
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for rows in d["devices"].values() for x in rows if "iPhone" in x["name"]))')
          ruby ios/test/run_tests.rb "$RUNNER_TEMP/carplay_tests" "$DEVICE"

  android:
    name: Android example release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --release
        working-directory: example
      - name: Run native Android regressions
        run: ./gradlew :flutter_carplay:testDebugUnitTest --console=plain
        working-directory: example/android
